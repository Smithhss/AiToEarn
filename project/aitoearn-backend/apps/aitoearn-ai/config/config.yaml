  accessKeyId: rustfsadmin
  secretAccessKey: rustfsadmin
  bucketName: aitoearn
  endpoint: http://rustfs.local:9000
  cdnEndpoint: https://aitoearn.aicos.ink/oss
  signExpires: 300
  forcePathStyle: true
  publicEndpoint: https://aitoearn.aicos.ink/oss
  provider: s3
