port: 3010
enableConfigLogging: false
enableBadRequestDetails: false
logger:
  console:
    enable: true
    level: debug
    pretty: false
    singleLine: false
    translateTime: true
appDomain: https://aitoearn.aicos.ink
auth:
  secret: change-this-jwt-secret
  internalToken: change-this-secret-token
redis:
  host: redis
  port: 6379
  username: default
  password: password
mongodb:
  uri: mongodb://admin:password@mongodb:27017/?authSource=admin&directConnection=true
  dbName: aitoearn
redlock:
  redis:
    host: redis
    port: 6379
    username: default
    password: password
  ttl: 300
  retryDelay: 1000
  retryCount: 3
serverClient:
